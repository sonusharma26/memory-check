schema_version: '0.1'
name: delete_removes_value
description: Deletion removes its target without deleting an unrelated control.
requires:
- create
- delete
- query
- user_scope
scope:
  user_id: alice
steps:
- create:
    id: canary
    value: '{{canary:CANARY}}'
- create:
    id: control
    value: '{{canary:CANARY_CONTROL}}'
- expect:
    query: MEMORYCHECK_CANARY
    contains:
    - '{{canary:CANARY}}'
    - '{{canary:CANARY_CONTROL}}'
- delete:
    id: canary
- expect:
    query: MEMORYCHECK_CANARY
    contains: '{{canary:CANARY_CONTROL}}'
    excludes: '{{canary:CANARY}}'
