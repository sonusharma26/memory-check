name: Source checks
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install source-check dependencies only
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Focused source regressions (no MemoryCheck build)
        run: python -m pytest -q --basetemp=.memorycheck/ci-tmp
      - name: Upload redacted JSON traces only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .memorycheck/traces/*.json
            .memorycheck/ci-tmp/**/traces/*.json
            .memorycheck/ci-tmp/**/plugin-traces/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  minimum-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --only-binary=:all: pytest==7.4.4 PyYAML==6.0 jsonschema==4.18.0 tomli==2.0.1
      - run: python -m pytest -q
