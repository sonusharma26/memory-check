[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "memorycheck"
dynamic = ["version"]
description = "Pytest-compatible lifecycle conformance tests for persistent AI memory systems"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pytest", "memory", "ai", "conformance", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["pytest>=7.4,<10", "PyYAML>=6.0,<7", "tomli>=2,<3; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["jsonschema>=4.18,<5"]
mem0 = ["mem0ai>=0.1.100,<3"]
langgraph = ["langgraph>=0.2,<2"]
postgres = ["langgraph>=0.2,<2", "langgraph-checkpoint-postgres>=2,<4", "psycopg[binary,pool]>=3.2,<4"]

[project.scripts]
memorycheck = "memorycheck.cli:main"

[project.entry-points.pytest11]
memorycheck = "memorycheck.pytest_plugin"

[tool.setuptools.dynamic]
version = {attr = "memorycheck._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["memorycheck*"]

[tool.setuptools.package-data]
memorycheck = ["py.typed", "contracts/builtin/*.yaml", "contracts/*.json", "trace/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
